<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KL Star Background</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background-color: #07090e; }
    /* The nebula is generated in small slices, then fades in once ready (no pop-in) */
    #nebula { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: #07090e;
              opacity: 0; transition: opacity 2.4s ease; }
    #nebula.ready { opacity: 1; }
    #nebula canvas { position: absolute; }
    #overlay { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
    #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
  </style>
</head>
<body>
  <div id="nebula"></div>
  <canvas id="bg-canvas"></canvas>
  <div id="overlay"></div>
  <script>
    // =====================================================================
    //  Shared KL star background.
    //  Embedded by index.html / colordle.html / 404.html via <iframe>.
    //  The parent forwards pointer + scroll info with postMessage.
    // =====================================================================
    const STATIC_MODE = false;   // true = nothing moves (single rendered frame)
    const NEB_SPEED = 1;         // speed of the drifting background colours (try 0.5 - 2)
    const NEB_FPS = 20;          // nebula redraw rate (it drifts very slowly, so 20 looks identical to 30)
    const NEB_PIXELS = 80000;    // nebula is computed at ~this many pixels, then smoothly upscaled
    const FPS_CAP = 80;          // 0 = follow display refresh. 80 keeps 60/90Hz untouched but halves work on 144Hz+ screens
    const SCROLL_IDLE_MS = 150;
    const MAX_STEP_MS = 50;      // animation clock never advances more than this per frame
    const INTRO_MS = 6500;       // roughly how long the KL assembly takes

    const rootEl = document.documentElement;
    let isScrolling = false;
    let lastScrollTime = 0;

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    const prefersReducedMotion = STATIC_MODE || window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---- Animation clock ----------------------------------------------
    // Advances only by (clamped) time between RENDERED frames. If the page stalls while the
    // parent loads Tailwind / fonts / etc., the intro simply pauses instead of skipping ahead,
    // which is what used to make the KL "suddenly appear".
    let clock = STATIC_MODE ? 1e7 : 0;
    let lastNow = null;
    let NEB_MS = 1000 / NEB_FPS;
    let quality = 0, emaDelta = 16.7, slowMs = 0;   // adaptive quality governor (see applyQuality)

    const KL = {
      heightRatio: 0.55,
      centerX: 0.5,
      centerY: 0.5,
      density: 0.012,
      minStars: 700,
      maxStars: 1600,
      assembleOnLoad: true
    };

    const MOTION = {
      radius: 120,
      drag: 0.02,
      part: 0.035,
      maxSpeed: 8,
      returnSpeed: 0.045
    };

    const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
    const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
    const easeInOutCubic = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

    const PALETTE = [
      { rgb: [178, 214, 255], w: 34 },
      { rgb: [255, 255, 255], w: 24 },
      { rgb: [120, 176, 255], w: 14 },
      { rgb: [255, 176, 112], w: 18 },
      { rgb: [255, 216, 178], w: 10 }
    ];
    const PALETTE_TOTAL = PALETTE.reduce((s, p) => s + p.w, 0);
    function pickColor() {
      let r = Math.random() * PALETTE_TOTAL;
      for (let i = 0; i < PALETTE.length; i++) {
        r -= PALETTE[i].w;
        if (r <= 0) return i;
      }
      return 0;
    }

    const GLOW_LEVELS = [16, 32, 64, 128];
    const GLOW_CORE = 0.12;
    const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const mixWhite = (c, k) => c.map(v => Math.round(v + (255 - v) * k));
    function spriteCanvas(size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      return c;
    }

    function makeGlow(rgb, size) {
      const c = spriteCanvas(size), g = c.getContext('2d'), h = size / 2;
      const core = mixWhite(rgb, 0.8);
      const grad = g.createRadialGradient(h, h, 0, h, h, h);
      grad.addColorStop(0, rgba([255, 255, 255], 1));
      grad.addColorStop(GLOW_CORE * 0.6, rgba(core, 1));
      grad.addColorStop(GLOW_CORE, rgba(core, 0.9));
      grad.addColorStop(0.2, rgba(rgb, 0.3));
      grad.addColorStop(0.38, rgba(rgb, 0.08));
      grad.addColorStop(0.65, rgba(rgb, 0.045));
      grad.addColorStop(1, rgba(rgb, 0));
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      return c;
    }

    function makeSpike(rgb) {
      const S = 128, h = 64;
      const c = spriteCanvas(S), g = c.getContext('2d');
      const tint = mixWhite(rgb, 0.5);
      g.globalCompositeOperation = 'lighter';
      for (const vertical of [false, true]) {
        const grad = vertical ? g.createLinearGradient(h, 0, h, S) : g.createLinearGradient(0, h, S, h);
        grad.addColorStop(0, rgba(tint, 0));
        grad.addColorStop(0.32, rgba(tint, 0.12));
        grad.addColorStop(0.5, 'rgba(255,255,255,0.95)');
        grad.addColorStop(0.68, rgba(tint, 0.12));
        grad.addColorStop(1, rgba(tint, 0));
        g.fillStyle = grad;
        if (vertical) g.fillRect(h - 1, 0, 2, S); else g.fillRect(0, h - 1, S, 2);
      }
      return c;
    }

    function makeHaze(rgb) {
      const S = 64, h = 32;
      const c = spriteCanvas(S), g = c.getContext('2d');
      const grad = g.createRadialGradient(h, h, 0, h, h, h);
      grad.addColorStop(0, rgba(rgb, 0.5));
      grad.addColorStop(0.45, rgba(rgb, 0.14));
      grad.addColorStop(1, rgba(rgb, 0));
      g.fillStyle = grad;
      g.fillRect(0, 0, S, S);
      return c;
    }

    // All sprites live in ONE atlas texture so the GPU can batch thousands of star draws
    const ATLAS_PAD = 4, ROW_H = 128 + ATLAS_PAD;
    const atlas = spriteCanvas(1);
    const glowRects = [], spikeRects = [], hazeRects = [];
    (function buildAtlas() {
      atlas.width = GLOW_LEVELS.reduce((a, v) => a + v, 0) + 128 + 64 + (GLOW_LEVELS.length + 2) * ATLAS_PAD;
      atlas.height = PALETTE.length * ROW_H;
      const g = atlas.getContext('2d');
      PALETTE.forEach((p, ci) => {
        let x = 0; const y = ci * ROW_H;
        const put = spr => { g.drawImage(spr, x, y); const r = { x, y, s: spr.width }; x += spr.width + ATLAS_PAD; return r; };
        glowRects.push(GLOW_LEVELS.map(s => put(makeGlow(p.rgb, s))));
        spikeRects.push(put(makeSpike(p.rgb)));
        hazeRects.push(put(makeHaze(p.rgb)));
      });
    })();
    function pickGlowLevel(diameter) {
      for (let i = 0; i < GLOW_LEVELS.length; i++) if (GLOW_LEVELS[i] >= diameter) return i;
      return GLOW_LEVELS.length - 1;
    }

    let width, height, dpr = 1;
    let ambientStars = [];
    let letterStars = [];
    let haloStars = [];
    let klBox = null;
    let leaving = null;          // previous star set, cross-fading out after a resize

    const MAX_DPR = 1;   // soft glows don't need hi-dpi; raise to 1.5 for crisper cores (costs ~2x fill)
    function getSize() {
      const de = document.documentElement;
      return {
        w: Math.max(window.innerWidth || 0, de.clientWidth || 0) || screen.width,
        h: Math.max(window.innerHeight || 0, de.clientHeight || 0) || screen.height
      };
    }
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
      const sz = getSize();
      width = sz.w;
      height = sz.h;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();

    const par = { x: 0, y: 0 };   // gentle pointer parallax for the nebula

    // ---- Pointer input (direct, or forwarded from the parent page) ------
    const ptr = { x: -9999, y: -9999, lastX: -9999, lastY: -9999, dx: 0, dy: 0, speed: 0, active: false };
    let pushing = false;
    let lastRealMove = -1e9;
    let autoActive = false;

    function onMove(x, y) {
      if (isScrolling) return;
      if (autoActive) {            // taking over from the auto-pilot: don't treat the jump as a swipe
        autoActive = false;
        ptr.lastX = ptr.lastY = -9999;
      }
      if (ptr.lastX > -9000) {
        ptr.dx += x - ptr.lastX;
        ptr.dy += y - ptr.lastY;
      }
      ptr.x = ptr.lastX = x;
      ptr.y = ptr.lastY = y;
      ptr.active = true;
      lastRealMove = performance.now();
    }
    function onLeave() {
      ptr.active = false;
      ptr.x = ptr.y = ptr.lastX = ptr.lastY = -9999;
      ptr.dx = ptr.dy = 0;
    }
    function onScroll() {
      lastScrollTime = performance.now();
      isScrolling = true;
      ptr.dx = ptr.dy = 0;
    }
    window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
    document.documentElement.addEventListener('mouseleave', onLeave);
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('message', e => {
      if (window.parent !== window && e.source !== window.parent) return;
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if ((d.type === 'mousemove' || d.type === 'pointer') && isFinite(d.x) && isFinite(d.y)) onMove(d.x, d.y);
      else if (d.type === 'leave') onLeave();
      else if (d.type === 'scroll') onScroll();
    });

    // ---- Noise helpers ---------------------------------------------------
    // 256x256 lattice of random values (built once). A table read is far cheaper than hashing
    // four corners per sample, and the nebula takes millions of samples.
    const LATTICE = new Float32Array(65536);
    (function () {
      let a = 0x9e3779b9;
      for (let i = 0; i < 65536; i++) {            // mulberry32
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        LATTICE[i] = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
    })();
    function valueNoise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = ix & 255, x1 = (ix + 1) & 255, r0 = (iy & 255) << 8, r1 = ((iy + 1) & 255) << 8;
      const a = LATTICE[x0 | r0], b = LATTICE[x1 | r0], c = LATTICE[x0 | r1], d = LATTICE[x1 | r1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2;

    function buildKLPoints() {
      const H = Math.min(height * KL.heightRatio, (width * 0.9) / 1.24);
      const S = H * 0.15;
      const T = S * 1.15;
      const Wk = H * 0.62;
      const Wl = H * 0.5;
      const gap = H * 0.12;
      const totalW = Wk + gap + Wl;
      const pad = 4;
      const cw = Math.ceil(totalW) + pad * 2;
      const ch = Math.ceil(H) + pad * 2;

      const off = document.createElement('canvas');
      off.width = cw;
      off.height = ch;
      const c = off.getContext('2d');
      c.fillStyle = '#fff';
      c.translate(pad, pad);

      c.fillRect(0, 0, S, H);
      const x2 = S * 0.35, mid = H / 2;
      c.beginPath();
      c.moveTo(Wk - T, 0); c.lineTo(Wk, 0); c.lineTo(x2 + T, mid); c.lineTo(x2, mid);
      c.closePath();
      c.fill();
      c.beginPath();
      c.moveTo(Wk - T, H); c.lineTo(Wk, H); c.lineTo(x2 + T, mid); c.lineTo(x2, mid);
      c.closePath();
      c.fill();

      const lx = Wk + gap;
      c.fillRect(lx, 0, S, H);
      c.fillRect(lx, H - S * 0.9, Wl, S * 0.9);

      const data = c.getImageData(0, 0, cw, ch).data;
      const filled = [];
      for (let y = 0; y < ch; y += 2) {
        for (let x = 0; x < cw; x += 2) {
          if (data[(y * cw + x) * 4 + 3] > 128) filled.push(x, y);
        }
      }
      const samples = filled.length / 2;
      const areaPx = samples * 4;
      const target = Math.max(KL.minStars, Math.min(KL.maxStars, Math.round(areaPx * KL.density)));

      const originX = width * KL.centerX - totalW / 2 - pad;
      const originY = height * KL.centerY - H / 2 - pad;
      klBox = { x: originX + pad, y: originY + pad, w: totalW, h: H };

      const seed = (Math.random() * 1000) | 0;
      const density = (x, y) => {
        const n = valueNoise(x / 46 + seed, y / 46 + seed * 0.37);
        return 0.55 + 0.45 * Math.min(1, Math.max(0, (n - 0.25) / 0.5));
      };
      const pickSample = () => {
        const i = (Math.random() * samples) | 0;
        return [filled[i * 2], filled[i * 2 + 1]];
      };

      const out = [];
      const nField = Math.round(target * 0.62);
      const nClump = Math.round(target * 0.30);
      const nStray = Math.round(target * 0.04);

      let guard = 0;
      while (out.length < nField && guard++ < nField * 20) {
        const [x, y] = pickSample();
        if (Math.random() > density(x, y)) continue;
        out.push({ x: x + gauss() * 1.3, y: y + gauss() * 1.3, kind: 'field' });
      }

      let made = 0;
      guard = 0;
      while (made < nClump && guard++ < nClump * 10) {
        const [x, y] = pickSample();
        if (Math.random() > density(x, y)) continue;
        const members = 4 + ((Math.random() * 7) | 0);
        const sigma = 2 + Math.random() * 2.5;
        out.push({ x, y, kind: 'lead' });
        for (let m = 1; m < members; m++) {
          out.push({ x: x + gauss() * sigma, y: y + gauss() * sigma, kind: 'field' });
        }
        made += members;
      }

      for (let s = 0; s < nStray; s++) {
        const [x, y] = pickSample();
        const ang = Math.random() * Math.PI * 2;
        const dist = 10 + Math.random() * 34;
        out.push({ x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist, kind: 'stray' });
      }

      for (const p of out) {
        p.x += originX;
        p.y += originY;
      }
      return out;
    }

    // =====================================================================
    //  Star
    //  Position = home + intro offset + physics offset + idle wobble.
    //  The intro offset is a deterministic eased tween (curved flight path), fully independent
    //  of frame rate and of the pointer physics, so the KL always forms as a smooth motion.
    // =====================================================================
    class Star {
      constructor(hx, hy, o) {
        const halo = o.layer === 'halo';
        const dust = o.layer === 'dust';
        const ambient = o.layer !== 'letter';
        this.hx = hx;
        this.hy = hy;
        this.born = o.born || 0;

        let mag = Math.pow(Math.random(), 3.2);
        if (o.kind === 'lead') mag = Math.max(mag, 0.4 + Math.random() * 0.5);
        if (o.kind === 'stray') mag *= 0.35;

        this.ci = pickColor();
        this.core = dust ? 0.22 + mag * 0.55 : halo ? 0.45 + mag * 0.9 : ambient ? 0.4 + mag * 1.3 : 0.75 + mag * 2.2;
        this.bright = dust ? 0.1 + mag * 0.3 : halo ? 0.12 + mag * 0.2 : ambient ? 0.1 + mag * 0.3 : 0.6 + mag * 0.3;
        this.glowSize = this.core * 2 / GLOW_CORE;
        this.glowRect = glowRects[this.ci][pickGlowLevel(this.glowSize)];
        this.spike = !halo && !dust && mag > 0.85;
        this.spikeSize = this.core * 26;

        this.hazeR = 0;
        if (!ambient && Math.random() < 0.12) {
          this.hazeR = 20 + Math.random() * 30;
          this.hazeA = 0.08 + Math.random() * 0.08;
        }

        this.tws = 0.0012 + Math.random() * 0.0035;
        this.twp = Math.random() * 6.283;

        this.ox = 0; this.oy = 0;
        this.vx = 0; this.vy = 0;
        this.w = MOTION.returnSpeed * (0.85 + Math.random() * 0.35);
        this.resp = (0.6 + Math.random() * 0.7) / (1 + mag * 0.8);

        this.idleFx = 0.0007 + Math.random() * 0.0011;
        this.idleFy = 0.0007 + Math.random() * 0.0011;
        this.idleSx = Math.random() * 1000;
        this.idleSy = Math.random() * 1000;
        this.idleAx = ambient ? 2.0 + Math.random() * 2.5 : 3.0 + Math.random() * 4.0;
        this.idleAy = ambient ? 2.0 + Math.random() * 2.5 : 3.0 + Math.random() * 4.0;

        this.ambient = ambient;
        this.driftX = (Math.random() - 0.5) * (halo || dust ? 0.04 : ambient ? 0.28 : 0.20);
        this.driftY = (Math.random() - 0.5) * (halo || dust ? 0.04 : ambient ? 0.28 : 0.20);

        // ---- intro flight ----
        this.intro = !!o.scatter;
        this.ix = 0; this.iy = 0;
        if (this.intro) {
          this.sx = Math.random() * width - hx;     // scatter offset from home
          this.sy = Math.random() * height - hy;
          const nx = klBox ? clamp01((hx - klBox.x) / klBox.w) : Math.random();
          // stars set off in a left-to-right wave, so the letters "draw in" instead of appearing at once
          this.moveStart = 400 + nx * 1300 + Math.random() * 600;
          this.moveDur = 2600 + Math.random() * 1400;
          this.curve = (Math.random() - 0.5) * 0.6;   // sideways bend of the flight path
          this.ix = this.sx; this.iy = this.sy;
        }

        // ---- fade-in (smoothstepped in update) ----
        if (ambient) {
          this.fadeStart = Math.random() * 800;
          this.fadeDur = 800 + Math.random() * 400;
        } else if (o.scatter) {
          this.fadeStart = Math.random() * 1000;
          this.fadeDur = 900 + Math.random() * 500;
        } else {
          this.fadeStart = Math.random() * 350;
          this.fadeDur = 500 + Math.random() * 400;
        }
        this.alpha = 0;
        this.x = hx + this.ix;
        this.y = hy + this.iy;
      }

      update(dt, t) {
        const el = t - this.born;
        const fp = el <= this.fadeStart ? 0 : Math.min(1, (el - this.fadeStart) / this.fadeDur);
        this.alpha = fp * fp * (3 - 2 * fp);

        if (this.ambient) {
          this.hx += this.driftX * dt;
          this.hy += this.driftY * dt;
          if (this.hx < -20) this.hx = width + 20; else if (this.hx > width + 20) this.hx = -20;
          if (this.hy < -20) this.hy = height + 20; else if (this.hy > height + 20) this.hy = -20;
        }

        // intro flight: eased tween along a curved path, landing exactly on home
        let ix = 0, iy = 0;
        if (this.intro) {
          if (el < this.moveStart) {
            this.sx += this.driftX * dt;
            this.sy += this.driftY * dt;
            ix = this.sx; iy = this.sy;
          } else {
            const p = Math.min(1, (el - this.moveStart) / this.moveDur);
            const e = easeInOutCubic(p);
            const c = Math.sin(Math.PI * p) * this.curve;
            ix = this.sx * (1 - e) - this.sy * c;
            iy = this.sy * (1 - e) + this.sx * c;
            if (p >= 1) { this.intro = false; ix = iy = 0; }
          }
        }

        // pointer physics (spring back to rest)
        let vx = this.vx, vy = this.vy;
        const cx = this.hx + ix + this.ox, cy = this.hy + iy + this.oy;

        if (pushing) {
          const dx = cx - ptr.x, dy = cy - ptr.y;
          const d2 = dx * dx + dy * dy, R = MOTION.radius;
          if (d2 < R * R) {
            const d = Math.sqrt(d2) + 0.001;
            const k = 1 - d / R;
            const f = k * k * this.resp;
            vx += (ptr.dx * MOTION.drag + (dx / d) * ptr.speed * MOTION.part) * f;
            vy += (ptr.dy * MOTION.drag + (dy / d) * ptr.speed * MOTION.part) * f;
          }
        }

        const w = this.w;
        const atRest = this.ox * this.ox + this.oy * this.oy < 1e-4 && vx * vx + vy * vy < 1e-6;
        if (atRest) {
          this.ox = this.oy = this.vx = this.vy = 0;
        } else {
          vx -= this.ox * w * w * dt;
          vy -= this.oy * w * w * dt;
          const damp = Math.exp(-2 * 0.88 * w * dt);
          vx *= damp;
          vy *= damp;

          const s2 = vx * vx + vy * vy;
          if (s2 > MOTION.maxSpeed * MOTION.maxSpeed) {
            const k = MOTION.maxSpeed / Math.sqrt(s2);
            vx *= k;
            vy *= k;
          }
          this.vx = vx;
          this.vy = vy;
          this.ox += vx * dt;
          this.oy += vy * dt;
        }

        // idle wobble is ALWAYS on (never switched on/off), so nothing snaps when the intro ends
        const idleX = prefersReducedMotion ? 0 : Math.sin(t * this.idleFx + this.idleSx) * this.idleAx;
        const idleY = prefersReducedMotion ? 0 : Math.cos(t * this.idleFy + this.idleSy) * this.idleAy;
        this.x = this.hx + ix + this.ox + idleX;
        this.y = this.hy + iy + this.oy + idleY;
      }
    }

    function initParticles(assemble, born) {
      ambientStars = [];
      const count = Math.min(320, Math.round((width * height) / 6500));
      for (let i = 0; i < count; i++) {
        ambientStars.push(new Star(Math.random() * width, Math.random() * height, { layer: 'ambient', born }));
      }
      letterStars = buildKLPoints().map(p =>
        new Star(p.x, p.y, { layer: 'letter', kind: p.kind, scatter: assemble, born })
      );
      buildHalo(born);
      buildDust(born);
    }

    // =====================================================================
    //  Procedural Milky Way + nebula
    //  Generated in small time-sliced chunks (never blocks a frame), then faded in.
    // =====================================================================
    const BAND_ANG = -0.45;
    const neb = document.getElementById('nebula');
    const nebSeed = Math.random() * 100;
    // Fewer octaves = cheaper. The result is rescaled to the 5-octave mean so thresholds/colours match.
    const FBM_NORM = Array.from({ length: 6 }, (_, o) => o ? 0.96875 / (1 - Math.pow(0.5, o)) : 0);
    const fbm = (x, y, oct = 5) => {
      let sum = 0, a = 0.5;
      for (let i = 0; i < oct; i++) { sum += a * valueNoise(x, y); x = x * 2.03 + 17.1; y = y * 2.03 + 9.7; a *= 0.5; }
      return sum * FBM_NORM[oct];
    };
    const sstep = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
    
    let nebLayers = [], nebCv = null, nebCtx = null, nebDim = null;
    const TAU = Math.PI * 2, per = sec => TAU / (sec * 1000);
    const LAYER_SPECS = [
      { key: 'cool',   ax: 75, ay: 50, tx: 42, ty: 55, tr: 90,  ts: 60, to: 26, rot: 0.010, op: 0.85, pulse: 0.22, par: 18 },
      { key: 'violet', ax: 65, ay: 58, tx: 51, ty: 38, tr: 75,  ts: 66, to: 33, rot: 0.012, op: 0.85, pulse: 0.30, par: 22 },
      { key: 'warm',   ax: 85, ay: 52, tx: 35, ty: 47, tr: 80,  ts: 52, to: 24, rot: 0.010, op: 0.75, pulse: 0.35, par: 26 },
      { key: 'rose',   ax: 90, ay: 62, tx: 29, ty: 44, tr: 70,  ts: 58, to: 21, rot: 0.012, op: 0.70, pulse: 0.42, par: 30 },
      { key: 'teal',   ax: 60, ay: 64, tx: 60, ty: 33, tr: 85,  ts: 48, to: 30, rot: 0.010, op: 0.85, pulse: 0.30, par: 16 },
      { key: 'dust',   ax: 45, ay: 34, tx: 70, ty: 80, tr: 110, ts: 90, to: 60, rot: 0.006, op: 0.95, pulse: 0.06, par: 12, plain: true }
    ];
    // fixed per-layer phases so a rebuild after a resize looks identical (no colour jump)
    const nebPhase = LAYER_SPECS.map(() => [Math.random() * TAU, Math.random() * TAU]);

    function* nebulaGen(W, H, M, sc, w, h) {
      const bc = document.createElement('canvas');
      bc.width = 2; bc.height = 256;
      const bg = bc.getContext('2d'), gr = bg.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, 'rgb(6,8,13)'); gr.addColorStop(0.72, 'rgb(11,18,37)'); gr.addColorStop(1, 'rgb(16,45,60)');
      bg.fillStyle = gr; bg.fillRect(0, 0, 2, 256);

      const tmp = document.createElement('canvas').getContext('2d');
      const imgs = LAYER_SPECS.map(() => tmp.createImageData(w, h));
      const d0 = imgs[0].data, d1 = imgs[1].data, d2 = imgs[2].data, d3 = imgs[3].data, d4 = imgs[4].data, d5 = imgs[5].data;
      const m = Math.min(W, H), ca = Math.cos(BAND_ANG), sa = Math.sin(BAND_ANG);
      const inv = sc / m, offX = (W / m) * 0.5, offY = (H / m) * 0.5, s2 = nebSeed * 2, s3 = nebSeed * 3;
      const G = 1.15;
      // colours as plain numbers (no per-pixel array allocation -> no GC hiccups)
      const WR = 255, WG = 140, WB = 110, GR = 255, GG = 205, GB = 150;
      let i = 0;
      for (let y = 0; y < h; y++) {
        const v = y * inv, py = v - offY;
        for (let x = 0; x < w; x++, i += 4) {
          const u = x * inv, px = u - offX;
          const warp = (fbm(u * 1.3 + s3, v * 1.3, 3) - 0.5) * 0.24;
          const dist = -px * sa + py * ca + warp, along = px * ca + py * sa;
          const al2 = along * along;
          let band = Math.exp(-(dist * dist) / 0.08);
          const bulge = Math.exp(-al2 / 0.14);
          band *= 0.6 + 0.6 * Math.exp(-al2 / 1.1);

          const gas = fbm(u * 2.2 + nebSeed, v * 2.2, 5);
          const fine = fbm(u * 6 + s2, v * 6, 4);
          const hue = fbm(u * 1.6 - nebSeed, v * 1.6 + 5, 3);
          const dens = band * (0.25 + gas * 1.1) * (0.75 + fine * 0.5);
          // dust lane is multiplied by band, so far from the band it is invisible: skip its noise
          const lane = band > 0.004 ? sstep(0.48, 0.72, fbm(u * 3.5 + 40, v * 3.5 - nebSeed, 4)) * band : 0;

          const s1 = sstep(0.3, 0.6, hue);
          const wv = sstep(0.6, 0.85, fine) * 0.55 * band;
          const Ib = dens * 0.55 * G;
          const Ic = Ib * (1 - s1), Iv = Ib * s1;
          let gk = bulge * band * 1.2; if (gk > 1) gk = 1;
          const Iw = Ib * wv * 1.1 + bulge * band * 0.16 * G;
          const Ie = sstep(0.6, 0.84, fbm(u * 1.8 + 120 + nebSeed, v * 1.8 - 30, 3)) * (0.25 + 0.75 * band) * 0.3 * G;
          const It = sstep(0.5, 0.85, fbm(u * 1.4 + 90, v * 1.4, 3)) * 0.11 * (1 - band * 0.5) * G;

          d0[i] = 46 * Ic;   d0[i + 1] = 104 * Ic;  d0[i + 2] = 214 * Ic;  d0[i + 3] = 255;
          d1[i] = 140 * Iv;  d1[i + 1] = 70 * Iv;   d1[i + 2] = 205 * Iv;  d1[i + 3] = 255;
          d2[i] = (WR + (GR - WR) * gk) * Iw; d2[i + 1] = (WG + (GG - WG) * gk) * Iw; d2[i + 2] = (WB + (GB - WB) * gk) * Iw; d2[i + 3] = 255;
          d3[i] = 225 * Ie;  d3[i + 1] = 70 * Ie;   d3[i + 2] = 140 * Ie;  d3[i + 3] = 255;
          d4[i] = 30 * It;   d4[i + 1] = 135 * It;  d4[i + 2] = 170 * It;  d4[i + 3] = 255;
          d5[i] = 2; d5[i + 1] = 3; d5[i + 2] = 8; d5[i + 3] = Math.min(255, lane * 0.8 * 255);
        }
        if ((y & 1) === 1) yield;   // hand control back regularly so a frame is never blocked
      }
      return { imgs, w, h, W, H, M, bc };
    }

    let nebJob = null;
    function startNebula() {
      const M = 160, W = width + M * 2, H = height + M * 2;
      const sc = Math.max(4, Math.sqrt((W * H) / NEB_PIXELS));   // big screens get a coarser (still smooth) grid
      const w = Math.ceil(W / sc), h = Math.ceil(H / sc);
      nebJob = nebulaGen(W, H, M, sc, w, h);   // replaces any unfinished older job
      if (STATIC_MODE) pumpNebula(Infinity);
    }
    function pumpNebula(budgetMs) {
      if (!nebJob) return;
      const t0 = performance.now();
      do {
        const r = nebJob.next();
        if (r.done) { const res = r.value; nebJob = null; finishNebula(res); return; }
      } while (performance.now() - t0 < budgetMs);
    }
    function finishNebula(res) {
      const { imgs, w, h, W, H, M, bc } = res;
      const layers = LAYER_SPECS.map((sp, k) => {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').putImageData(imgs[k], 0, 0);
        return {
          el: c, plain: !!sp.plain, ax: sp.ax, ay: sp.ay, rot: sp.rot, op: sp.op, pulse: sp.pulse, par: sp.par,
          fx: per(sp.tx), fy: per(sp.ty), fr: per(sp.tr), fs: per(sp.ts), fo: per(sp.to),
          px: nebPhase[k][0], py: nebPhase[k][1]
        };
      });
      // One low-res canvas: layers are blended inside it (cheap), then the browser upscales it once
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.style.cssText = `left:${-M}px;top:${-M}px;width:${W}px;height:${H}px`;
      const g = cv.getContext('2d', { alpha: false });
      nebLayers = layers;
      nebDim = { W, H, M, kx: w / W, ky: h / H, bg: bc };
      nebCtx = g;
      updateNebula(clock);                       // paint before it becomes visible
      if (nebCv && nebCv.parentNode) nebCv.parentNode.removeChild(nebCv);
      nebCv = cv;
      neb.appendChild(cv);
      requestAnimationFrame(() => neb.classList.add('ready'));   // fade in (first build) / no-op afterwards
    }

    function updateNebula(t) {
      t *= NEB_SPEED;
      if (!nebCtx) return;
      const g = nebCtx, { W, H, M, kx, ky, bg } = nebDim;
      g.setTransform(kx, 0, 0, ky, 0, 0);
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
      g.drawImage(bg, 0, M, W, H - 2 * M);
      for (const L of nebLayers) {
        const dx = Math.sin(t * L.fx + L.px) * L.ax - par.x * L.par;
        const dy = Math.cos(t * L.fy + L.py) * L.ay - par.y * L.par;
        const r = Math.sin(t * L.fr + L.px * 2) * L.rot;
        const sc = 1 + Math.sin(t * L.fs + L.py) * 0.03;
        const o = Math.min(1, L.op * (1 + L.pulse * Math.sin(t * L.fo + L.px)));
        g.setTransform(kx, 0, 0, ky, 0, 0);
        g.translate(W / 2 + dx, H / 2 + dy); g.rotate(r); g.scale(sc, sc);
        g.globalCompositeOperation = L.plain ? 'source-over' : 'screen';
        g.globalAlpha = o;
        g.drawImage(L.el, -W / 2, -H / 2, W, H);
      }
    }

    // Dense tiny stars along the Milky Way band, baked ONCE into a static offscreen canvas.
    let dustLayer = null, dustBorn = 0;
    function buildDust(born) {
      dustBorn = born || 0;
      dustLayer = document.createElement('canvas');
      dustLayer.width = width; dustLayer.height = height;
      const g = dustLayer.getContext('2d');
      g.globalCompositeOperation = 'lighter';
      const n = Math.min(1200, Math.round((width * height) / 1800));
      const ca = Math.cos(BAND_ANG), sa = Math.sin(BAND_ANG), diag = Math.hypot(width, height);
      const sigma = Math.min(width, height) * 0.2 * 0.85;
      let made = 0, guard = 0;
      while (made < n && guard++ < n * 4) {
        const along = (Math.random() - 0.5) * diag * 1.1, offs = gauss() * sigma;
        const x = width / 2 + along * ca - offs * sa, y = height / 2 + along * sa + offs * ca;
        if (x < 0 || x > width || y < 0 || y > height) continue;
        const p = new Star(x, y, { layer: 'dust' });
        const s = p.glowSize;
        g.globalAlpha = Math.min(1, p.bright * (0.5 + Math.random() * 0.7));
        const gr = p.glowRect;
        g.drawImage(atlas, gr.x, gr.y, gr.s, gr.s, x - s / 2, y - s / 2, s, s);
        made++;
      }
    }

    // Occasional shooting star (fades in at the head so it never pops)
    let shoot = null, nextShoot = 4000 + Math.random() * 6000;
    function drawShoot(t, dt) {
      if (!shoot && t > nextShoot && !prefersReducedMotion) {
        const a = 0.35 + Math.random() * 0.5;
        shoot = { x: Math.random() * width * 0.7, y: Math.random() * height * 0.35, vx: Math.cos(a) * 14, vy: Math.sin(a) * 14, life: 0, max: 55 };
      }
      if (!shoot) return;
      shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt; shoot.life += dt;
      const k = (1 - shoot.life / shoot.max) * Math.min(1, shoot.life / 8);
      if (shoot.life >= shoot.max) { shoot = null; nextShoot = t + 7000 + Math.random() * 12000; return; }
      const tx = shoot.x - shoot.vx * 11, ty = shoot.y - shoot.vy * 11;
      const gr = ctx.createLinearGradient(tx, ty, shoot.x, shoot.y);
      gr.addColorStop(0, 'rgba(180,210,255,0)');
      gr.addColorStop(1, `rgba(225,238,255,${0.85 * k})`);
      ctx.globalAlpha = 1; ctx.strokeStyle = gr; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(shoot.x, shoot.y); ctx.stroke();
      ctx.globalAlpha = k; const sg = glowRects[0][1]; ctx.drawImage(atlas, sg.x, sg.y, sg.s, sg.s, shoot.x - 9, shoot.y - 9, 18, 18);
    }

    function buildHalo(born) {
      haloStars = [];
      if (!klBox) return;
      const m = klBox.h * 0.3, gap = klBox.h * 0.05;
      const x0 = Math.max(10, klBox.x - m), x1 = Math.min(width - 10, klBox.x + klBox.w + m);
      const y0 = Math.max(10, klBox.y - m), y1 = Math.min(height - 10, klBox.y + klBox.h + m);
      const count = Math.max(18, Math.min(45, Math.round(width * height / 26000)));
      let guard = 0;
      while (haloStars.length < count && guard++ < 2000) {
        const x = x0 + Math.random() * (x1 - x0), y = y0 + Math.random() * (y1 - y0);
        const inside = x > klBox.x - gap && x < klBox.x + klBox.w + gap && y > klBox.y - gap && y < klBox.y + klBox.h + gap;
        if (inside) continue;
        haloStars.push(new Star(x, y, { layer: 'halo', born }));
      }
    }

    function drawStars(list, t) {
      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        if (p.alpha <= 0.01) continue;

        const sineWave = Math.sin(t * p.tws + p.twp);
        const tw = p.ambient
          ? Math.max(0, (sineWave + 0.15) * 1.35)
          : Math.max(0.35, (sineWave + 0.35) * 1.2);
        const a = p.alpha * p.bright * tw;

        if (a <= 0.008) continue;

        if (p.hazeR) {
          ctx.globalAlpha = Math.min(1, p.alpha * p.hazeA * tw);
          const hs = p.hazeR * 2;
          const hr = hazeRects[p.ci]; ctx.drawImage(atlas, hr.x, hr.y, hr.s, hr.s, p.x - p.hazeR, p.y - p.hazeR, hs, hs);
        }

        ctx.globalAlpha = Math.min(1, a);
        const s = p.glowSize;
        const gr = p.glowRect; ctx.drawImage(atlas, gr.x, gr.y, gr.s, gr.s, p.x - s / 2, p.y - s / 2, s, s);

        if (p.spike) {
          ctx.globalAlpha = Math.min(1, a * 0.75);
          const L = p.spikeSize;
          const sr = spikeRects[p.ci]; ctx.drawImage(atlas, sr.x, sr.y, sr.s, sr.s, p.x - L / 2, p.y - L / 2, L, L);
        }
      }
    }

    (function addGrain() {
      const n = 160;
      const c = document.createElement('canvas');
      c.width = c.height = n;
      const g = c.getContext('2d');
      const img = g.createImageData(n, n);
      for (let i = 0; i < img.data.length; i += 4) {
        img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
        img.data[i + 3] = Math.random() * 255 * 0.04;
      }
      g.putImageData(img, 0, 0);
      const ov = document.getElementById('overlay');
      ov.style.backgroundImage = `radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(2,3,10,0.7) 100%), url(${c.toDataURL()})`;
      ov.style.backgroundSize = `100% 100%, ${n}px ${n}px`;
    })();

    // ---- Adaptive quality ------------------------------------------------
    // If frames keep taking too long (weak GPU / busy machine) shed load in two steps instead of stuttering.
    // Level 1: slower nebula redraw, no large haze sprites.  Level 2: also thin out the star field.
    function applyQuality() {
      NEB_MS = 1000 / (quality >= 1 ? 10 : NEB_FPS);
      if (quality >= 1) for (const list of [ambientStars, letterStars, haloStars]) for (const p of list) p.hazeR = 0;
      if (quality >= 2) {
        ambientStars = ambientStars.filter((p, i) => i % 2 === 0);
        haloStars = haloStars.filter((p, i) => i % 2 === 0);
        letterStars = letterStars.filter((p, i) => p.spike || i % 3 !== 0);
      }
    }

    // ---- Resize handling: rebuild, cross-fading the old stars out ------------
    let resizeTimer;
    function rebuild() {
      const old = [...ambientStars, ...letterStars, ...haloStars];
      if (!STATIC_MODE && old.length) {
        old.forEach(p => { p.alpha0 = p.alpha; });
        leaving = { stars: old, dust: dustLayer, t0: clock };
      }
      resize();
      const assemble = KL.assembleOnLoad && !prefersReducedMotion && clock < INTRO_MS;
      initParticles(assemble, STATIC_MODE ? 0 : clock);
      applyQuality();
      startNebula();
      kick();
    }
    function checkSize() {
      const sz = getSize();
      if (sz.w !== width || sz.h !== height) rebuild();
    }
    function scheduleCheck() { clearTimeout(resizeTimer); resizeTimer = setTimeout(checkSize, 150); }
    window.addEventListener('resize', scheduleCheck);
    if (window.ResizeObserver) new ResizeObserver(scheduleCheck).observe(document.documentElement);
    setInterval(checkSize, 4000); // wallpaper engines don't always fire resize (display change, wake from sleep)

    // ---- Auto-pilot cursor for wallpaper engines that never deliver mouse events ----
    const AUTO_IDLE = 3500;
    const AUTO_START = 5000;   // wait until the KL has mostly formed
    let autoT = 0, autoLast = null, autoGain = 0;
    function autoPilot(now, dt) {
      if (prefersReducedMotion || clock < AUTO_START || now - lastRealMove < AUTO_IDLE) {
        autoLast = null; autoGain = 0; autoActive = false; return;
      }
      autoActive = true;
      autoGain = Math.min(1, autoGain + dt * 0.02);    // ease the virtual cursor in
      autoT += 0.016 * dt;
      const cx = width * KL.centerX, cy = height * KL.centerY;
      const ax = cx + width * 0.38 * Math.sin(autoT * 0.9 + 0.6 * Math.sin(autoT * 0.37));
      const ay = cy + height * 0.30 * Math.sin(autoT * 0.61 + 1.3);
      if (autoLast) { ptr.dx += (ax - autoLast.x) * autoGain; ptr.dy += (ay - autoLast.y) * autoGain; }
      ptr.x = ax; ptr.y = ay; ptr.active = true;
      autoLast = { x: ax, y: ay };
    }

    // ---- Main loop -------------------------------------------------------
    initParticles(KL.assembleOnLoad && !prefersReducedMotion, 0);
    startNebula();

    let skipFrame = false, lastNeb = -1e9;
    function kick() { if (STATIC_MODE) requestAnimationFrame(frame); }

    function frame(now) {
      if (!STATIC_MODE) requestAnimationFrame(frame);
      if (document.hidden) { lastNow = null; return; }

      if (lastNow === null) lastNow = now - 16.667;
      const delta = now - lastNow;
      if (FPS_CAP && delta < 1000 / FPS_CAP - 2) return;

      if (isScrolling && now - lastScrollTime > SCROLL_IDLE_MS) isScrolling = false;
      if (isScrolling) {                       // half rate while the parent is scrolling
        skipFrame = !skipFrame;
        if (skipFrame) return;
      } else skipFrame = false;

      lastNow = now;
      if (!STATIC_MODE && !isScrolling && clock > INTRO_MS + 1500 && !nebJob && delta < 200) {
        emaDelta += (delta - emaDelta) * 0.04;
        slowMs = emaDelta > 26 ? slowMs + delta : 0;          // sustained < ~38 fps
        if (slowMs > 2500 && quality < 2) { quality++; applyQuality(); slowMs = 0; emaDelta = 16.7; }
      }
      const step = Math.min(delta, MAX_STEP_MS);
      if (!STATIC_MODE) clock += step;
      const dt = Math.max(0.1, step / 16.667);
      const t = clock;

      pumpNebula(STATIC_MODE ? Infinity : 4);   // build the nebula a few ms per frame
      autoPilot(now, dt);

      let rawSpeed = Math.hypot(ptr.dx, ptr.dy);
      if (rawSpeed > 60) {
        ptr.dx *= 60 / rawSpeed;
        ptr.dy *= 60 / rawSpeed;
        rawSpeed = 60;
      }
      ptr.speed = rawSpeed;
      pushing = ptr.active && ptr.speed > 0.05 && !isScrolling && !prefersReducedMotion;

      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < ambientStars.length; i++) ambientStars[i].update(dt, t);
      for (let i = 0; i < letterStars.length; i++) letterStars[i].update(dt, t);
      for (let i = 0; i < haloStars.length; i++) haloStars[i].update(dt, t);

      ctx.globalCompositeOperation = 'lighter';

      // previous star set fading out after a resize
      if (leaving) {
        const k = 1 - (t - leaving.t0) / 700;
        if (k <= 0) leaving = null;
        else {
          const ease = k * k * (3 - 2 * k);
          if (leaving.dust) { ctx.globalAlpha = ease * 0.85; ctx.drawImage(leaving.dust, 0, 0); }
          for (const p of leaving.stars) p.alpha = p.alpha0 * ease;
          drawStars(leaving.stars, t);
        }
      }

      if (dustLayer) {
        ctx.globalAlpha = smooth((t - dustBorn) / 1400) * (0.85 + 0.15 * Math.sin(t * 0.0008));
        ctx.drawImage(dustLayer, 0, 0, width, height);
      }
      drawStars(ambientStars, t);
      drawStars(letterStars, t);
      drawStars(haloStars, t);
      drawShoot(t, dt);

      // frame-rate independent parallax smoothing
      const pk = 1 - Math.pow(0.98, dt);
      par.x += ((ptr.active ? ptr.x / width - 0.5 : 0) - par.x) * pk;
      par.y += ((ptr.active ? ptr.y / height - 0.5 : 0) - par.y) * pk;

      if (!prefersReducedMotion && t - lastNeb >= NEB_MS - 4) { lastNeb = t; updateNebula(t); }
      ctx.globalAlpha = 1;

      ptr.dx = ptr.dy = 0;
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
