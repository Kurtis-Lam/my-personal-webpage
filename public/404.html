<!-- 404.html -->
<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#38bdf8">
  <title>404 Page Not Found | Kurtis Lam</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .animated-gradient-text {
      background: linear-gradient(-45deg, #00f2fe, #4facfe, #00c6ff, #0072ff, #a855f7);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="bg-[#07090e] text-slate-100 font-sans antialiased overflow-x-hidden min-h-screen selection:bg-cyan-500 selection:text-black flex flex-col justify-between">

  <!-- Embedded Shared Background -->
  <iframe id="bg-iframe" src="background.html" class="fixed inset-0 w-full h-full border-0 z-0 pointer-events-none" aria-hidden="true"></iframe>

  <!-- Main Container -->
  <div class="relative z-10 max-w-3xl mx-auto px-6 py-16 flex flex-col items-center justify-center min-h-screen text-center">

    <!-- 404 Glass Card -->
    <div class="glass-card rounded-3xl p-8 md:p-12 w-full max-w-2xl flex flex-col items-center space-y-6 shadow-2xl relative overflow-hidden">
      
      <!-- Top Badge -->
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-rose-500/30 bg-rose-500/10 text-xs font-mono text-rose-400 tracking-wide uppercase">
        <span class="w-2 h-2 rounded-full bg-rose-400 animate-ping"></span>
        <span>Error 404</span>
      </div>

      <!-- Large 404 Number -->
      <h1 class="text-7xl sm:text-8xl md:text-9xl font-extrabold tracking-tight">
        <span class="animated-gradient-text">404</span>
      </h1>

      <!-- Subtitle -->
      <h2 class="text-2xl sm:text-3xl font-bold text-slate-100">
        Lost in Cyberspace
      </h2>

      <!-- Description -->
      <p class="text-slate-400 text-sm md:text-base font-mono leading-relaxed max-w-lg">
        The route or resource you are looking for does not exist or has been relocated. Let's get you back on track!
      </p>

      <!-- Actions -->
      <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-4 w-full sm:w-auto">
        <a href="index.html" class="w-full sm:w-auto bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-xl px-8 py-3.5 transition-all duration-300 transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20 font-mono text-sm">
          <i class="fa-solid fa-house"></i>
          <span>Back to Home</span>
        </a>
      </div>

    </div>

    <!-- Footer Note -->
    <footer class="mt-12 text-xs font-mono text-slate-500">
      Made with 💖 by Kurtis Lam
    </footer>

  </div>

  <script>
    // Forward mousemove events to background iframe
    const bgIframe = document.getElementById('bg-iframe');
    window.addEventListener('mousemove', (e) => {
      if (bgIframe && bgIframe.contentWindow) {
        bgIframe.contentWindow.postMessage({
          type: 'mousemove',
          x: e.clientX,
          y: e.clientY
        }, '*');
      }
    }, { passive: true });
  </script>
</body>
</html>
