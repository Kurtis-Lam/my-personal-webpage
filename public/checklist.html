<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grinder - Multi-Account Sync Checklist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      background-color: #07090e;
      margin: 0;
      min-height: 100vh;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Custom Interactive Cursor */
    .cursor-dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      position: fixed;
      top: 0;
      left: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
    }

    .cursor-outline {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(56, 189, 248, 0.5);
      position: fixed;
      top: 0;
      left: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: all 0.15s ease-out;
    }

    /* Glassmorphism styling */
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.15);
    }
    
    .glass-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .glass-input:focus, .glass-input:focus-within {
      border-color: #38bdf8;
      outline: none;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    /* Styled Select Dropdown Options */
    select.glass-select option {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 8px;
    }

    /* Custom styling for native time picker icon */
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8) sepia(1) saturate(5) hue-rotate(170deg);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-[#07090e] antialiased relative">

  <!-- Canvas Background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Dynamic Ambient Light Orbs -->
  <div id="orb-left" class="fixed top-1/4 -left-40 w-[30rem] h-[30rem] rounded-full blur-[100px] pointer-events-none transition-all duration-1000"></div>
  <div id="orb-right" class="fixed bottom-1/4 -right-40 w-[30rem] h-[30rem] rounded-full blur-[100px] pointer-events-none transition-all duration-1000"></div>

  <!-- Custom Glowing Cursor -->
  <div class="cursor-dot hidden md:block" id="cursor-dot"></div>
  <div class="cursor-outline hidden md:block" id="cursor-outline"></div>

  <!-- Main Application Content -->
  <main class="relative z-10 max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 glass-card p-6 rounded-2xl shadow-2xl">
      <div>
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-cyan-300 to-indigo-400">
          Grinder Checklist
        </h1>
        <p class="text-sm text-slate-400 mt-1">Realtime cross-device task tracking with customizable reset schedules (UTC+8)</p>
      </div>
      <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-3 py-1.5 rounded-full">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Live Sync Active</span>
      </div>
    </header>

    <!-- Top Controls Grid: Add Account & Add Task -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
      
      <!-- Account Management Card -->
      <section class="lg:col-span-4 glass-card p-6 rounded-2xl flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-semibold text-sky-400 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            1. Manage Accounts
          </h2>
          <form id="add-account-form" class="flex gap-2 mb-4">
            <input type="text" id="account-name-input" placeholder="Account Name (e.g. Account 1)" required
              class="flex-1 glass-input text-slate-100 placeholder-slate-500 text-sm rounded-xl px-4 py-2.5 transition">
            <button type="submit" 
              class="bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-medium text-sm px-4 py-2.5 rounded-xl transition shadow-lg shadow-sky-500/20 active:scale-95 whitespace-nowrap">
              + Add
            </button>
          </form>
        </div>
        
        <div>
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Accounts List</h3>
          <div id="accounts-list" class="flex flex-wrap gap-2 min-h-[40px]">
            <span class="text-xs text-slate-500 italic">No accounts added yet</span>
          </div>
        </div>
      </section>

      <!-- Checklist Items Management Card -->
      <section class="lg:col-span-8 glass-card p-6 rounded-2xl flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-semibold text-sky-400 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            2. Manage Checklist Items
          </h2>

          <form id="add-item-form" class="flex flex-col gap-3 mb-4">
            <!-- Task Name Row -->
            <div>
              <input type="text" id="item-title-input" placeholder="Item Name (e.g. Daily Quest A / Weekly Boss)" required
                class="w-full glass-input text-slate-100 placeholder-slate-500 text-sm rounded-xl px-4 py-2.5 transition">
            </div>

            <!-- Custom Schedule Controls Row -->
            <div class="flex flex-wrap gap-2.5 items-center">
              
              <!-- Frequency Segmented Pill Selector -->
              <div class="flex glass-input rounded-xl p-1 items-center flex-1 min-w-[150px]">
                <button type="button" id="freq-daily-btn" onclick="setFrequency('daily')" 
                  class="flex-1 py-1.5 px-3 text-xs font-semibold rounded-lg transition-all duration-200 bg-gradient-to-r from-sky-500 to-blue-600 text-white shadow-md shadow-sky-500/20">
                  ☀️ Daily
                </button>
                <button type="button" id="freq-weekly-btn" onclick="setFrequency('weekly')" 
                  class="flex-1 py-1.5 px-3 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition-all duration-200">
                  📅 Weekly
                </button>
              </div>

              <!-- Day Selector (Visible when Weekly is selected) -->
              <div id="day-select-wrapper" class="hidden flex-1 min-w-[140px]">
                <div class="relative flex items-center glass-input px-3 py-2 rounded-xl transition">
                  <svg class="w-4 h-4 text-sky-400 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                  </svg>
                  <span class="text-xs text-slate-400 mr-2 whitespace-nowrap">Day:</span>
                  <select id="item-reset-day-input" class="glass-select bg-transparent text-slate-100 text-xs font-semibold focus:outline-none cursor-pointer w-full appearance-none pr-4">
                    <option value="1">Monday</option>
                    <option value="2">Tuesday</option>
                    <option value="3">Wednesday</option>
                    <option value="4">Thursday</option>
                    <option value="5">Friday</option>
                    <option value="6">Saturday</option>
                    <option value="0">Sunday</option>
                  </select>
                  <div class="pointer-events-none absolute right-3 text-sky-400 text-[10px]">▼</div>
                </div>
              </div>

              <!-- Custom Time Picker Input -->
              <div class="flex items-center glass-input px-3 py-2 rounded-xl flex-1 min-w-[150px] transition">
                <svg class="w-4 h-4 text-sky-400 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="text-xs text-slate-400 mr-2 whitespace-nowrap">Time:</span>
                <input type="time" id="item-reset-input" value="00:00" required
                  class="bg-transparent text-slate-100 text-xs font-mono font-semibold focus:outline-none cursor-pointer w-full tracking-wider">
              </div>

              <!-- Submit Button -->
              <button type="submit" 
                class="w-full sm:w-auto bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-medium text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-sky-500/20 active:scale-95 flex items-center justify-center gap-1.5 shrink-0">
                <span>+ Add Item</span>
              </button>

            </div>
          </form>
        </div>

        <div>
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Global Items List</h3>
          <div id="items-list" class="flex flex-wrap gap-2 min-h-[40px]">
            <span class="text-xs text-slate-500 italic">No checklist items created yet</span>
          </div>
        </div>
      </section>

    </div>

    <!-- Account Specific Checklists Section -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
          <span>Account Checklists Grid</span>
        </h2>
      </div>

      <!-- Account Cards Container -->
      <div id="account-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered Dynamically -->
      </div>
    </section>

  </main>

  <!-- Background Canvas Logic -->
  <script>
    // Ambient Light Orbs Generator
    function generateBrightVibrantColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsla(${hue}, 95%, 60%, 0.45)`;
    }
    const orbLeft = document.getElementById('orb-left');
    const orbRight = document.getElementById('orb-right');
    if (orbLeft && orbRight) {
      orbLeft.style.backgroundColor = generateBrightVibrantColor();
      orbRight.style.backgroundColor = generateBrightVibrantColor();
    }

    // Custom Cursor Controls
    const cursorDot = document.getElementById('cursor-dot');
    const cursorOutline = document.getElementById('cursor-outline');

    function updateCursor(x, y) {
      if (!cursorDot || !cursorOutline) return;
      cursorDot.style.left = `${x}px`;
      cursorDot.style.top = `${y}px`;
      cursorOutline.animate({
        left: `${x}px`,
        top: `${y}px`
      }, { duration: 500, fill: "forwards" });
    }

    window.addEventListener('mousemove', (e) => {
      updateCursor(e.clientX, e.clientY);
    });

    // Canvas Particle System
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    const mouse = { x: -1000, y: -1000, radius: 150 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
      }

      draw() {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouse.radius) {
          const angle = Math.atan2(dy, dx);
          const force = (mouse.radius - distance) / mouse.radius;
          this.x -= Math.cos(angle) * force * 3;
          this.y -= Math.sin(angle) * force * 3;
        }
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.floor((width * height) / 12000);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }
    initParticles();

    function connectParticles() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a; b < particles.length; b++) {
          let dx = particles[a].x - particles[b].x;
          let dy = particles[a].y - particles[b].y;
          let distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < 120) {
            let opacity = 1 - distance / 120;
            ctx.strokeStyle = `rgba(56, 189, 248, ${opacity * 0.15})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      connectParticles();
      requestAnimationFrame(animate);
    }
    animate();
  </script>

  <!-- Firebase Realtime Database Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Provided Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9Asmg2L0blF2wND_ALeSCc8hU9VdI-mY",
      authDomain: "kurtis-lam.firebaseapp.com",
      databaseURL: "https://kurtis-lam-default-rtdb.firebaseio.com",
      projectId: "kurtis-lam",
      storageBucket: "kurtis-lam.firebasestorage.app",
      messagingSenderId: "440828859685",
      appId: "1:440828859685:web:1545697326852c7d5036cc",
      measurementId: "G-WVKPTSJ4YH"
    };

    // Initialize Firebase & DB Reference
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const grinderRef = ref(db, 'grinder');

    // Form DOM Elements
    const addAccountForm = document.getElementById('add-account-form');
    const accountNameInput = document.getElementById('account-name-input');
    const accountsListContainer = document.getElementById('accounts-list');

    const addItemForm = document.getElementById('add-item-form');
    const itemTitleInput = document.getElementById('item-title-input');
    const itemResetDayInput = document.getElementById('item-reset-day-input');
    const itemResetInput = document.getElementById('item-reset-input');
    const itemsListContainer = document.getElementById('items-list');

    const accountCardsGrid = document.getElementById('account-cards-grid');

    // Frequency state management
    let currentFrequency = 'daily';

    window.setFrequency = function(freq) {
      currentFrequency = freq;
      const dailyBtn = document.getElementById('freq-daily-btn');
      const weeklyBtn = document.getElementById('freq-weekly-btn');
      const dayWrapper = document.getElementById('day-select-wrapper');

      if (freq === 'daily') {
        dailyBtn.className = "flex-1 py-1.5 px-3 text-xs font-semibold rounded-lg transition-all duration-200 bg-gradient-to-r from-sky-500 to-blue-600 text-white shadow-md shadow-sky-500/20";
        weeklyBtn.className = "flex-1 py-1.5 px-3 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition-all duration-200";
        dayWrapper.classList.add('hidden');
      } else {
        weeklyBtn.className = "flex-1 py-1.5 px-3 text-xs font-semibold rounded-lg transition-all duration-200 bg-gradient-to-r from-sky-500 to-blue-600 text-white shadow-md shadow-sky-500/20";
        dailyBtn.className = "flex-1 py-1.5 px-3 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition-all duration-200";
        dayWrapper.classList.remove('hidden');
      }
    };

    // Local State Cache
    let currentData = {
      accounts: {},
      items: {},
      status: {}
    };

    // --- Helper: Format reset schedule display text ---
    function formatResetSchedule(item) {
      const freq = item.frequency || 'daily';
      const time = item.resetTime || '00:00';
      if (freq === 'weekly') {
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const dayName = days[item.resetDay !== undefined ? item.resetDay : 1];
        return `Weekly (${dayName}) @ ${time} UTC+8`;
      }
      return `Daily @ ${time} UTC+8`;
    }

    // --- Helper: Calculate the most recent reset timestamp for Daily / Weekly items (UTC+8) ---
    function getLastResetTimestamp(item) {
      const frequency = item.frequency || 'daily';
      const resetTime = item.resetTime || '00:00';
      const [hours, minutes] = resetTime.split(':').map(Number);

      const now = new Date();
      // Shift date to UTC+8 zone
      const utc8Date = new Date(now.getTime() + (8 * 60 * 60 * 1000));

      const year = utc8Date.getUTCFullYear();
      const month = utc8Date.getUTCMonth();
      const day = utc8Date.getUTCDate();
      const currentDayOfWeek = utc8Date.getUTCDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat

      // Target reset point today in UTC+8 (converted to standard UTC timestamp)
      const resetTodayUTC = Date.UTC(year, month, day, hours - 8, minutes, 0, 0);

      if (frequency === 'daily') {
        if (now.getTime() < resetTodayUTC) {
          // Current time hasn't hit today's reset point yet, so previous reset was yesterday
          return resetTodayUTC - (24 * 60 * 60 * 1000);
        } else {
          return resetTodayUTC;
        }
      } else if (frequency === 'weekly') {
        const targetDay = item.resetDay !== undefined ? Number(item.resetDay) : 1; // Default to Mon (1)
        let daysDiff = (currentDayOfWeek - targetDay + 7) % 7;

        if (daysDiff === 0 && now.getTime() < resetTodayUTC) {
          daysDiff = 7;
        }

        return resetTodayUTC - (daysDiff * 24 * 60 * 60 * 1000);
      }

      return resetTodayUTC;
    }

    // Helper: Evaluates if an item is currently completed or expired
    function isItemDone(accId, item) {
      const rawStatus = currentData.status[accId]?.[item.id];
      if (!rawStatus) return false;

      let isDone = false;
      let checkedAt = 0;

      // Compatibility with old boolean status vs object status
      if (typeof rawStatus === 'boolean') {
        isDone = rawStatus;
        checkedAt = item.createdAt || Date.now();
      } else if (typeof rawStatus === 'object') {
        isDone = !!rawStatus.done;
        checkedAt = rawStatus.checkedAt || 0;
      }

      if (!isDone) return false;

      const lastReset = getLastResetTimestamp(item);

      // If task was completed BEFORE the latest reset time, auto-reset to false in Firebase
      if (checkedAt < lastReset) {
        set(ref(db, `grinder/status/${accId}/${item.id}`), { done: false, checkedAt: 0 });
        return false;
      }

      return true;
    }

    // --- 24/7 Realtime Listener ---
    onValue(grinderRef, (snapshot) => {
      const data = snapshot.val() || {};
      currentData = {
        accounts: data.accounts || {},
        items: data.items || {},
        status: data.status || {}
      };
      renderUI();
    });

    // Periodic Check Loop (Updates state if reset time passes while page stays open)
    setInterval(() => {
      renderUI();
    }, 10000);

    // --- Event Listeners ---

    // 1. Add Account
    addAccountForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = accountNameInput.value.trim();
      if (!name) return;

      const accountsRef = ref(db, 'grinder/accounts');
      const newAccountRef = push(accountsRef);
      set(newAccountRef, {
        name: name,
        createdAt: Date.now()
      }).then(() => {
        accountNameInput.value = '';
      });
    });

    // 2. Add Checklist Item
    addItemForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = itemTitleInput.value.trim();
      const resetTime = itemResetInput.value || '00:00';
      const resetDay = currentFrequency === 'weekly' ? parseInt(itemResetDayInput.value, 10) : 1;
      if (!title) return;

      const itemsRef = ref(db, 'grinder/items');
      const newItemRef = push(itemsRef);
      set(newItemRef, {
        title: title,
        frequency: currentFrequency,
        resetDay: resetDay,
        resetTime: resetTime,
        createdAt: Date.now()
      }).then(() => {
        itemTitleInput.value = '';
      });
    });

    // Global Functions Attached to Window for Inline Handlers
    window.deleteAccount = function(accId) {
      if (confirm("Are you sure you want to delete this account?")) {
        remove(ref(db, `grinder/accounts/${accId}`));
        remove(ref(db, `grinder/status/${accId}`));
      }
    };

    window.deleteItem = function(itemId) {
      if (confirm("Are you sure you want to delete this checklist item across all accounts?")) {
        remove(ref(db, `grinder/items/${itemId}`));
        // Cleanup completion statuses for this item
        Object.keys(currentData.accounts).forEach(accId => {
          remove(ref(db, `grinder/status/${accId}/${itemId}`));
        });
      }
    };

    window.toggleTaskStatus = function(accId, itemId, currentDoneStatus) {
      const statusRef = ref(db, `grinder/status/${accId}/${itemId}`);
      if (currentDoneStatus) {
        set(statusRef, { done: false, checkedAt: 0 });
      } else {
        set(statusRef, { done: true, checkedAt: Date.now() });
      }
    };

    // --- Render Pipeline ---
    function renderUI() {
      const accountsArray = Object.entries(currentData.accounts).map(([id, val]) => ({ id, ...val }));
      const itemsArray = Object.entries(currentData.items).map(([id, val]) => ({ id, ...val }));

      // Render Accounts Tags
      if (accountsArray.length === 0) {
        accountsListContainer.innerHTML = `<span class="text-xs text-slate-500 italic">No accounts added yet</span>`;
      } else {
        accountsListContainer.innerHTML = accountsArray.map(acc => `
          <span class="inline-flex items-center gap-1.5 bg-sky-950/80 border border-sky-500/30 text-sky-300 text-xs px-3 py-1 rounded-lg">
            <span>${escapeHtml(acc.name)}</span>
            <button onclick="deleteAccount('${acc.id}')" class="text-slate-400 hover:text-red-400 font-bold ml-1" title="Delete Account">&times;</button>
          </span>
        `).join('');
      }

      // Render Global Items Tags
      if (itemsArray.length === 0) {
        itemsListContainer.innerHTML = `<span class="text-xs text-slate-500 italic">No checklist items created yet</span>`;
      } else {
        itemsListContainer.innerHTML = itemsArray.map(item => `
          <span class="inline-flex items-center gap-2 bg-indigo-950/80 border border-indigo-500/30 text-indigo-300 text-xs px-3 py-1.5 rounded-xl shadow-sm">
            <span class="font-medium">${escapeHtml(item.title)}</span>
            <span class="text-[10px] text-indigo-300/80 bg-indigo-900/60 px-2 py-0.5 rounded-lg border border-indigo-500/20 font-mono">
              ${escapeHtml(formatResetSchedule(item))}
            </span>
            <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-red-400 font-bold ml-1 transition" title="Delete Item">&times;</button>
          </span>
        `).join('');
      }

      // Render Accounts Checklist Grid
      if (accountsArray.length === 0) {
        accountCardsGrid.innerHTML = `
          <div class="col-span-full text-center py-12 glass-card rounded-2xl">
            <p class="text-slate-400">Please add an account above to get started.</p>
          </div>
        `;
        return;
      }

      accountCardsGrid.innerHTML = accountsArray.map(acc => {
        const completedCount = itemsArray.filter(i => isItemDone(acc.id, i)).length;
        const totalCount = itemsArray.length;
        const progressPercent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

        return `
          <div class="glass-card rounded-2xl p-5 flex flex-col justify-between border-t-2 border-t-sky-400 shadow-xl">
            <div>
              <!-- Account Card Header -->
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-lg font-bold text-slate-100 truncate">${escapeHtml(acc.name)}</h3>
                <span class="text-xs font-semibold text-sky-400 bg-sky-500/10 border border-sky-500/20 px-2.5 py-1 rounded-full">
                  ${completedCount} / ${totalCount} Done
                </span>
              </div>

              <!-- Progress Bar -->
              <div class="w-full bg-slate-800 rounded-full h-2 mb-4 overflow-hidden">
                <div class="bg-gradient-to-r from-sky-400 to-indigo-500 h-2 rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
              </div>

              <!-- Checklist Items List for this Account -->
              <div class="space-y-2 mt-4">
                ${itemsArray.length === 0 ? `
                  <p class="text-xs text-slate-500 italic py-2 text-center">No checklist items. Add one above!</p>
                ` : itemsArray.map(item => {
                  const isDone = isItemDone(acc.id, item);
                  return `
                    <div 
                      onclick="toggleTaskStatus('${acc.id}', '${item.id}',${isDone})"
                      class="flex items-center justify-between p-2.5 rounded-xl border transition cursor-pointer select-none ${
                        isDone 
                          ? 'bg-emerald-950/20 border-emerald-500/30 text-emerald-300' 
                          : 'bg-slate-800/40 border-slate-700/50 text-slate-300 hover:border-slate-500'
                      }">
                      <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-md border flex items-center justify-center transition ${
                          isDone 
                            ? 'bg-emerald-500 border-emerald-400 text-slate-950' 
                            : 'border-slate-500 bg-slate-900/50'
                        }">
                          ${isDone ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>' : ''}
                        </div>
                        <div>
                          <span class="text-sm font-medium ${isDone ? 'line-through text-slate-400' : ''}">
                            ${escapeHtml(item.title)}
                          </span>
                          <span class="text-[10px] text-slate-400/80 block font-mono mt-0.5">
                            ${escapeHtml(formatResetSchedule(item))}
                          </span>
                        </div>
                      </div>
                      <span class="text-[10px] uppercase tracking-wider font-semibold ${isDone ? 'text-emerald-400' : 'text-slate-500'}">
                        ${isDone ? 'Done' : 'To Do'}
                      </span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            
            <div class="mt-5 pt-3 border-t border-slate-800 flex justify-end">
              <button onclick="deleteAccount('${acc.id}')" class="text-xs text-red-400/70 hover:text-red-400 transition">
                Remove Account
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Helper Utility to Prevent XSS
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
